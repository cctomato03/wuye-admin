name: release-docker

# 触发方式：
#  1) 在 GitHub 上发布 Release（推荐）：Actions 会以 release 的 tag 构建镜像，并把这个 tag 的镜像 tar.gz 上传到该 Release 附件；
#  2) 手动触发（workflow_dispatch）：填一个 tag（如 v1.2.0），构建后作为 Actions Artifact 供下载（不上传 Release）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例如 v1.2.0）'
        required: true
        type: string

permissions:
  contents: write # 上传 Release 附件
  packages: read

concurrency:
  group: release-docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build zhsq/wuye-admin image & package tar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_REPO: zhsq/wuye-admin
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          RAW='${{ github.event.release.tag_name || inputs.tag }}'
          # docker tag 不允许 / 等字符：把非法字符替换为 -
          TAG="$(echo "$RAW" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          if [ -z "$TAG" ]; then echo "empty tag" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "Resolved: raw=$RAW -> image tag=$TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.raw }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" >/dev/null
          docker run --rm --entrypoint /app/web-basic "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" -v || true

      - name: Save image to tar.gz
        id: pack
        run: |
          set -euo pipefail
          SAFE="$(echo "${{ steps.meta.outputs.tag }}" | sed 's#^v##')"
          OUT="wuye-admin-${SAFE}-linux-amd64.tar.gz"
          docker save "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" | gzip -9 > "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT" "$OUT.sha256"

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.pack.outputs.file }}
            ${{ steps.pack.outputs.file }}.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ---
            ### 🐳 Docker 镜像
            - 镜像：`${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}`（linux/amd64）
            - 附件：`${{ steps.pack.outputs.file }}` + `.sha256`
            - 使用：`gunzip -c ${{ steps.pack.outputs.file }} | docker load`

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wuye-admin-${{ steps.meta.outputs.tag }}-linux-amd64
          path: |
            ${{ steps.pack.outputs.file }}
            ${{ steps.pack.outputs.file }}.sha256
          compression-level: 0
          retention-days: 14

      # 如需同时推送到镜像仓库（Docker Hub / GHCR），取消下面注释并配置对应 secrets：
      # - name: Log in to Docker Hub
      #   if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Push
      #   run: docker push "$IMAGE_REPO:${{ steps.meta.outputs.tag }}"
